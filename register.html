```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Event Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .register-container h1 {
            text-align: center;
            color: #243b55;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .register-container p {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #243b55;
            box-shadow: 0 0 5px rgba(36, 59, 85, 0.2);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #141e30;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .login-link a {
            color: #243b55;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 25px;
            }

            .register-container h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>
        <p>Join the Campus Event Management System</p>

        <form id="registerForm">

            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="8"
                    required>
            </div>
            <select aria-label="Login As" class="input-group" required>
                <option value="" disabled selected>Login As</option>
                <option value="student">Student</option>
                <option value="organiser">Event Organiser</option>
                <option value="admin">Administrator</option>
            </select>

            <button type="submit" class="register-btn">
                Register
            </button>

            <div id="message" role="status" aria-live="polite"></div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/">Login</a>
        </div>

    </div>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match!";
                return;
            }

            message.style.color = "green";
            message.textContent =
                "Form validated! Connect a backend to create your account.";
        });
    </script>

</body>
</html>
```
